<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<title>Task Manager</title>
		<link rel="icon" type="image" href="assets/img/favicon.svg">
		<link rel="stylesheet" href="assets/css/style.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
	</head>
	<body>
	<div class="container">
		<div class="todo-app">
			<h1>To Do App</h1>

			<form class="input-area">
				<input type="text" placeholder="Add a new task..." id="task-input">
				<button type="submit" id="add-task-btn"><i class="fa-regular fa-plus"></i></button>
			</form>
			<div class="to-dos-container">
				<div class="empty-state" id="empty-state">
					<img src="assets/img/empty.svg" alt="empty illustration" class="empty-image">
					<p>You have no tasks</p>
				</div>
				<ul id="task-list">
					
				</ul>
			</div>
		</div>
	</div>
		<script src="assets/js/script.js"></script>
	</body>
</html>
