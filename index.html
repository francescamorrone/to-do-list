<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<title>Task Manager</title>
		<link rel="stylesheet" href="assets/css/style.css" />
	</head>
	<body>
		<h1 id="titolo">I miei task</h1>

		<form id="taskForm" class="aggiunta">
			<input id="nuovo-task" placeholder="Cosa devi fare?" type="text" name="nuovo-task"/>
			<button id="bottone-aggiungi" type="submit" >Aggiungi</button>
		</form>

		<div id="filtri"  class="filtri">
			<button type="button" id="tutti" class="btn-filtro attivo">Tutti</button>
			<button type="button" id="attivi" class="btn-filtro">Attivi</button>
			<button type="button" id="completati" class="btn-filtro">Completati</button>
		</div>

		<ul id="lista-task"></ul>

		<p>Totale: <span id="contatore">0</span></p>

		<script src="assets/js/script.js"></script>
	</body>
</html>
